<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shop Storefront & Receipt Icon -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Store Roof Awning -->
    <path d="M 40,160 L 256,40 L 472,160 Z" fill="url(#accentGrad)" />
    <!-- Main Building Body -->
    <rect x="70" y="160" width="372" height="240" rx="16" fill="#ffffff" opacity="0.95" />
    <!-- Shop Entrance Door -->
    <rect x="206" y="260" width="100" height="140" rx="8" fill="#1e293b" />
    <!-- Windows / Displays -->
    <rect x="106" y="200" width="70" height="70" rx="12" fill="#38bdf8" />
    <rect x="336" y="200" width="70" height="70" rx="12" fill="#38bdf8" />
  </g>
</svg>